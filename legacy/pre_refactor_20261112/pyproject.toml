[project]
name = "utc-sar-oil-detection"
version = "0.1.0"
description = "Classical NumPy SAR image processing coursework with Streamlit demo"
readme = "README.md"
authors = [
    { name = "Hina Kasumi", email = "nguyenhaihieu89@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.100.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pandas>=2.0.0",
    "python-multipart>=0.0.6",
    "scipy>=1.10.0",
    "scikit-image>=0.25.0",
    "streamlit>=1.41.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.17.4",
]
docs = [
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "pypdf>=5.0",
    "pypdfium2>=5.15.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_report.py" = ["E402"]
