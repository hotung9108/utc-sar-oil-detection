[project]
name = "utc-sar-oil-detection"
version = "0.2.0"
description = "SAR oil detection coursework: dataset-first refactor foundation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy==2.5.4", "scipy==1.18.1", "scikit-image==0.26.0",
  "scikit-learn==1.9.1", "Pillow==13.0.0", "matplotlib==3.11.2",
  "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0",
  "tifffile==2026.11.8",
]

[project.optional-dependencies]
web = ["streamlit==1.67.0"]
demo = [
    "imageio-ffmpeg==0.6.0",
    "pyqt6==6.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", ".venv", ".refactor_work"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["legacy", ".refactor_work"]
